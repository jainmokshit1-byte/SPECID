[project]
name = "specid-backend"
version = "0.1.0"
description = "SpecID prototype API (PS SIH26099)"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses calls in argument defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "ml: needs the embedding model or FAISS; run with `make test-ml` (TRD TR-CI-02)",
]

[tool.mypy]
python_version = "3.11"
files = ["app/core"]
strict = true
